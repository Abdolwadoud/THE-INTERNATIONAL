<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10264a"><meta name="description" content="THE INTERNATIONAL — منصة تعليمية للتعلم عن بعد">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
<title>THE INTERNATIONAL</title>
</head>
<body>
<header class="topbar">
  <div class="brandmark">TI</div><div class="brand"><strong>THE INTERNATIONAL</strong><small id="tagline">مدرستك أينما كنت</small></div>
  <select id="language" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select>
</header>
<main>
<section class="welcome panel">
  <span class="eyebrow" id="welcome-label">منصة التعلم عن بُعد</span>
  <h1 id="welcome-title">مستقبلك يبدأ بالتعلّم</h1>
  <p id="welcome-text">تعلّم في أي وقت، وتابع دروسك وتقدّمك من مكان واحد.</p>
  <div class="welcome-actions"><button class="primary" id="explore">استكشف الدروس</button><span class="status"><i></i><span id="offline-label">جاهز للتعلّم</span></span></div>
</section>
<section class="stats">
  <article class="stat"><span class="stat-icon">▤</span><strong id="course-count">3</strong><small id="courses-stat">دروس تجريبية</small></article>
  <article class="stat"><span class="stat-icon">✓</span><strong id="progress-value">0%</strong><small id="progress-stat">تقدّمك</small></article>
  <article class="stat"><span class="stat-icon">☆</span><strong id="points-value">0</strong><small id="points-stat">نقاط التعلّم</small></article>
</section>
<section id="courses-section">
  <div class="section-head"><div><span class="eyebrow" id="library-label">مكتبتك التعليمية</span><h2 id="courses-title">تابع التعلّم</h2></div><span class="pill" id="sample-label">محتوى تجريبي</span></div>
  <div class="filters" id="filters">
    <button class="filter active" data-filter="all" id="filter-all">الكل</button>
    <button class="filter" data-filter="science" id="filter-science">العلوم</button>
    <button class="filter" data-filter="math" id="filter-math">الرياضيات</button>
    <button class="filter" data-filter="language" id="filter-language">اللغات</button>
  </div>
  <div class="course-grid" id="course-grid"></div>
</section>
<section class="next panel">
 <div class="next-icon">✦</div><div><h3 id="next-title">خطوة صغيرة كل يوم</h3><p id="next-text">أكمل درسًا واحدًا اليوم لبناء عادة تعلّم قوية.</p></div>
</section>
</main>
<nav class="bottom-nav"><button class="nav-item selected" id="nav-home"><span>⌂</span><small id="nav-home-label">الرئيسية</small></button><button class="nav-item" id="nav-lessons"><span>▤</span><small id="nav-lessons-label">الدروس</small></button><button class="nav-item" id="nav-progress"><span>◴</span><small id="nav-progress-label">تقدّمي</small></button><button class="nav-item" id="nav-profile"><span>○</span><small id="nav-profile-label">حسابي</small></button></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body></html>
